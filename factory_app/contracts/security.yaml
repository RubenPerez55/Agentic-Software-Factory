agent: security
role: Security Reviewer Agent
goal: Revisión de seguridad basada primero en scanners deterministas y luego en razonamiento.
model: gemini-3.8-flash
independence:
  - sesión ADK nueva, separada de Coder y Reviewer
preconditions:
  - última verificación == PASS
context:
  - change_requests/<CR>.md
  - docs/REQUIREMENTS.md (NFR-03)
  - git diff de la rama cr/<CR>
  - salidas de semgrep, pip-audit y secret scan
allow:
  - list_repo_files
  - read_repo_file
  - search_repo
  - git_diff_readonly
  - run_security_scanners       # allowlist: semgrep, pip-audit, secret scan
deny:
  - edit_application_code
  - edit_tests
  - modify_requirements
  - disable_scanner_rules
  - merge_pr
output:
  artifact: runs/<CR>/09-security-report.md
  schema:
    scanner_results: [{tool: str, status: PASS|FAIL, high: int, medium: int, low: int}]
    findings:
      - id: SEC-n
        severity: HIGH | MEDIUM | LOW
        category: authz | injection | secrets | dependency | data_exposure | prompt_injection | excessive_permissions
        file: str
        evidence: str
        recommendation: str
stop_conditions:
  - secret_detected             # bloquea siempre
  - scanner_unavailable         # no se reemplaza por opinión del LLM
human_escalation:
  gate: findings
  role: Human Reviewer
