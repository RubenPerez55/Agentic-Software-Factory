agent: evidence
role: Evidence Agent
goal: Consolidar la evidencia ya producida; nunca inventar evidencia faltante.
model: gemini-3.8-flash          # candidato a Flash-Lite (bonus model routing)
context:
  - runs/<CR>/*
allow:
  - list_repo_files
  - read_repo_file
  - write_run_evidence            # solo runs/<CR>/
deny:
  - write_outside_runs
  - make_release_decision
  - fabricate_missing_evidence
output:
  artifacts:
    - runs/<CR>/14-evidence-summary.md
    - runs/<CR>/traceability.md
  # factory-run.json lo genera código determinista (factory_app/evidence.py), no el LLM.
stop_conditions:
  - missing_required_artifact
  - finding_without_human_decision
human_escalation:
  gate: release
  role: Release Manager
